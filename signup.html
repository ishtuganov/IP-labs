</head>
<body>
  <header class="header">
    <a href="#"> <img src="logo.jpg"> </a>
    <div class="logo">Социальная сеть</div>
    <nav class="navbar">
      <div class="dropdown">
        <button class="dropbtn">Меню</button>
        <div class="dropdown-content">
          <a href="index.html">Главная</a>

  <main class="content">
    <section class="auth-form">
      <h2>Регистрация</h2>
      <p>Создайте аккаунт, чтобы начать пользоваться всеми возможностями.</p>
      <form>
        <label for="name">Имя:</label>
        <input type="text" id="name" placeholder="Введите ваше имя" required>
        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="Введите ваш email" required>
        <label for="password">Пароль:</label>
        <input type="password" id="password" placeholder="Введите пароль" required>
        <button type="submit" class="btn-primary">Зарегистрироваться</button>
      </form>
      <p>Уже есть аккаунт? <a href="login.html">Войдите</a></p>
    </section>
  </main>
